spring:
  application:
    name: stock-server
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: finance
    password: 1234
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      data-source-properties:
        oracle.jdbc.defaultNChar: "true"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding : UTF-8

server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

stock:
  mock:
    enabled: true
    tick-interval: 5000
  order:
    match-interval: 5000

kis:
  app-key: ${KIS_APP_KEY:}
  app-secret: ${KIS_APP_SECRET:}
  base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
  call-delay-ms: 100
