name: CI

on:
  push:
    branches:
      - develop
      - feat/#61-kis-daily-seed-runner

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean bootJar -x test

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:develop

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.BASTION_PRIVATE_KEY }}" > ~/.ssh/bastion04

          chmod 600 ~/.ssh/bastion04

      - name: Deploy bank-server
        run: |
          ssh -i ~/.ssh/bastion04 \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.BASTION_PORT }} \
            ${{ secrets.BASTION_USER }}@${{ secrets.BASTION_HOST }} \
            "ssh -i ~/team04-jooho.pem ubuntu@172.21.33.217 \"cd ~/infra && bash scripts/deploy-stock.sh\""